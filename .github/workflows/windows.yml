name: Windows2025Playwright

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: RunWindowsCheck
        shell: pwsh
        run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: windows-10549-evidence
          path: evidence/windows-verification.json
          if-no-files-found: error
          retention-days: 1
